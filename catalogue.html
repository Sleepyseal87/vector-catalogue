<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaldecor — Vector Catalogue</title>
  <script src="catalogue-manifest.js"></script>
  <!-- Google Fonts loaded once globally — applies inside shadow roots too -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  #catalogue-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Host element handles canvas size, scaling, clipping */
  .catalogue-page {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    transform-origin: top center;
    flex-shrink: 0;
    display: block;
  }

  #pdf-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #444;
    padding: 10px 18px;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    z-index: 9999;
    text-transform: uppercase;
  }

  #pdf-btn:hover { background: #333; }

  #loading {
    color: #666;
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media print {
    body { margin: 0; padding: 0; background: none; }
    #catalogue-container { padding: 0; background: none; }
    .catalogue-page { break-after: page; page-break-after: always; transform: none !important; margin-bottom: 0 !important; }
    #pdf-btn { display: none; }
    #loading { display: none; }
  }
  </style>
</head>
<body>

  <button id="pdf-btn" onclick="window.print()">Save as PDF</button>

  <div id="catalogue-container">
    <div id="loading">Loading catalogue&hellip;</div>
  </div>

  <script>
    async function loadCatalogue() {
      const container = document.getElementById('catalogue-container');
      const loading = document.getElementById('loading');

      for (const filename of pages) {
        try {
          const response = await fetch(filename + '.html');
          if (!response.ok) {
            console.warn(`Failed to load ${filename}: ${response.status}`);
            continue;
          }

          const html = await response.text();

          // Parse properly — handles nested divs, no regex truncation
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          // Collect <style> blocks
          const styleTags = [...doc.querySelectorAll('style')]
            .map(el => el.outerHTML)
            .join('\n');

          // Collect <link> stylesheets — skip only Google Fonts (loaded globally)
          const linkTags = [...doc.querySelectorAll('link[rel="stylesheet"]')]
            .filter(el => !el.getAttribute('href').includes('fonts.googleapis.com'))
            .map(el => el.outerHTML)
            .join('\n');

          // Extract the full .page element (outerHTML preserves class for CSS targeting)
          const pageEl = doc.querySelector('.page');
          if (!pageEl) {
            console.warn(`No .page div found in ${filename}`);
            continue;
          }

          // Shadow DOM isolates each page's CSS — no cross-page style bleed
          const pageDiv = document.createElement('div');
          pageDiv.className = 'catalogue-page';
          const shadow = pageDiv.attachShadow({ mode: 'open' });
          shadow.innerHTML = linkTags + '\n' + styleTags + '\n' + pageEl.outerHTML;

          container.appendChild(pageDiv);
        } catch (err) {
          console.warn(`Error loading ${filename}:`, err);
        }
      }

      loading.remove();
    }

    document.addEventListener('DOMContentLoaded', loadCatalogue);
  </script>

  <script>
    function scalePages() {
      const pages = document.querySelectorAll('.catalogue-page');
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scaleW = vw / 1080;
      const scaleH = vh / 1350;
      const scale = vw <= 1080 ? scaleW : scaleH;
      const marginBottom = (scale - 1) * 1350;
      pages.forEach(p => {
        p.style.transform = `scale(${scale})`;
        p.style.marginBottom = marginBottom + 'px';
      });
    }
    window.addEventListener('resize', scalePages);
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(scalePages, 500);
    });
  </script>

</body>
</html>
