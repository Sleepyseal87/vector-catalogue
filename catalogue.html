<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaldecor — Vector Catalogue</title>
  <script src="catalogue-manifest.js"></script>
  <!-- Google Fonts loaded once globally — applies inside shadow roots too -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  #catalogue-container {
    width: 100%;           /* full viewport width so align-items:center is vs viewport */
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;    /* clip 1080px children on narrow screens */
  }

  /* Host element handles canvas size, scaling, clipping */
  .catalogue-page {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    transform-origin: top center;
    flex-shrink: 0;
    display: block;
  }

  #pdf-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #444;
    padding: 10px 18px;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    z-index: 9999;
    text-transform: uppercase;
  }

  #pdf-btn:hover    { background: #333; }
  #pdf-btn:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 768px) { #pdf-btn { display: none; } }

  #loading {
    color: #666;
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media print {
    @page { size: 1080px 1350px; margin: 0; }
    body { margin: 0; padding: 0; background: none; width: 1080px; }
    #catalogue-container { display: block; width: 1080px; background: none; overflow: visible; }
    .catalogue-page { break-after: page; page-break-after: always; transform: none !important; margin-bottom: 0 !important; width: 1080px !important; height: 1350px !important; overflow: hidden !important; }
    #pdf-btn { display: none; }
    #loading { display: none; }
  }
  </style>
</head>
<body>

  <button id="pdf-btn" onclick="window.print()" disabled>Save as PDF</button>

  <div id="catalogue-container">
    <div id="loading">Loading catalogue&hellip;</div>
  </div>

  <script>
    function scalePages() {
      const els = document.querySelectorAll('.catalogue-page');
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = vw <= 1080 ? vw / 1080 : vh / 1350;
      const marginBottom = (scale - 1) * 1350;
      els.forEach(p => {
        p.style.transform = `scale(${scale})`;
        p.style.marginBottom = marginBottom + 'px';
      });
    }
    window.addEventListener('resize', scalePages);

    async function loadCatalogue() {
      const container = document.getElementById('catalogue-container');
      const loading   = document.getElementById('loading');
      const pdfBtn    = document.getElementById('pdf-btn');

      // Fetch all pages in parallel — much faster than sequential
      const htmlList = await Promise.all(
        pages.map(filename =>
          fetch(filename + '.html')
            .then(r => r.ok ? r.text() : null)
            .catch(() => null)
        )
      );

      const parser = new DOMParser();

      for (let i = 0; i < pages.length; i++) {
        const html = htmlList[i];
        if (!html) { console.warn(`Failed to load ${pages[i]}`); continue; }

        const doc = parser.parseFromString(html, 'text/html');

        const styleTags = [...doc.querySelectorAll('style')]
          .map(el => el.outerHTML).join('\n');

        const linkTags = [...doc.querySelectorAll('link[rel="stylesheet"]')]
          .filter(el => !el.getAttribute('href').includes('fonts.googleapis.com'))
          .map(el => el.outerHTML).join('\n');

        const pageEl = doc.querySelector('.page');
        if (!pageEl) { console.warn(`No .page in ${pages[i]}`); continue; }

        const pageDiv = document.createElement('div');
        pageDiv.className = 'catalogue-page';
        const shadow = pageDiv.attachShadow({ mode: 'open' });
        shadow.innerHTML = linkTags + '\n' + styleTags + '\n' + pageEl.outerHTML;

        container.appendChild(pageDiv);
      }

      loading.remove();
      scalePages();          // scale after ALL pages are in the DOM
      pdfBtn.disabled = false;
    }

    document.addEventListener('DOMContentLoaded', loadCatalogue);
  </script>

</body>
</html>
