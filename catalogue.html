<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaldecor — Vector Catalogue</title>
  <script src="catalogue-manifest.js"></script>
  <link rel="stylesheet" href="catalogue-styles.css">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  #catalogue-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    transform-origin: top center;
    flex-shrink: 0;
  }

  #pdf-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #444;
    padding: 10px 18px;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    z-index: 9999;
    text-transform: uppercase;
  }

  #pdf-btn:hover { background: #333; }

  #loading {
    color: #666;
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media print {
    body { margin: 0; padding: 0; background: none; }
    #catalogue-container { padding: 0; background: none; }
    .page { break-after: page; page-break-after: always; transform: none !important; margin-bottom: 0 !important; }
    #pdf-btn { display: none; }
    #loading { display: none; }
  }
</style>
</head>
<body>

  <button id="pdf-btn" onclick="window.print()">Save as PDF</button>

  <div id="catalogue-container">
    <div id="loading">Loading catalogue&hellip;</div>
  </div>

  <script>
    async function loadCatalogue() {
      const container = document.getElementById('catalogue-container');
      const loading = document.getElementById('loading');

      for (const filename of pages) {
        try {
          const response = await fetch(filename + '.html');
          if (!response.ok) {
            console.warn(`Failed to load ${filename}: ${response.status}`);
            continue;
          }

          const html = await response.text();

          // Extract body innerHTML
          const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
          if (!bodyMatch) {
            console.warn(`No <body> found in ${filename}`);
            continue;
          }

          let bodyContent = bodyMatch[1];

          // Strip any <link> tags referencing catalogue-styles.css
          bodyContent = bodyContent.replace(
            /<link[^>]*catalogue-styles\.css[^>]*>/gi,
            ''
          );

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.innerHTML = bodyContent;

          container.appendChild(pageDiv);
        } catch (err) {
          console.warn(`Error loading ${filename}:`, err);
        }
      }

      loading.remove();
    }

    document.addEventListener('DOMContentLoaded', loadCatalogue);
  </script>
<script>
  function scalePages() {
    const pages = document.querySelectorAll('.page');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scaleW = vw / 1080;
    const scaleH = vh / 1350;
    const scale = vw <= 1080 ? scaleW : scaleH;
    const marginBottom = (scale - 1) * 1350;
    pages.forEach(p => {
      p.style.transform = `scale(${scale})`;
      p.style.marginBottom = marginBottom + 'px';
    });
  }
  window.addEventListener('resize', scalePages);
  document.addEventListener('DOMContentLoaded', () => {
    // Run after pages finish loading
    setTimeout(scalePages, 500);
  });
</script>
</body>
</html>
